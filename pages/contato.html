<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Bananinha Wear | Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <header class="topo">
        <nav class="navbar container" aria-label="Menu principal">
            <a class="logo" href="../index.html">bananinha <span>WEAR</span></a>
            <div class="menu">
                <a class="nav-link" href="../index.html">Início</a>
                <a class="nav-link" href="./produtos.html">Produtos</a>
                <a class="nav-link" href="./sobre.html">Sobre</a>
                <a class="nav-link ativo" href="./pages/contato.html">Contato</a>
            </div>
        </nav>
    </header>

        <main>
            <section class="titulo-pagina">
                <div class="container">
                    <p class="destaque">Fale com a gente</p>
                </div>

        <section class=" secao formulario">
            <div class="contato-texto">
                <form action="contato.html" method="get">
             <label for="nome">Nome completo *</label>
             <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" required>
                <label for="motivo">Qual motivo do contato?</label>
                <textarea id="motivo" name="motivo"></textarea>
                 </form>
            </div>
        </section>  
        <section class="formulario">       
            <label class="opcao"><input type="checkbox" name="promessa" required>Aceito todos os termos de responsabilidade*</label>

            <button type="submit" class="btn botao">Enviar mensagem</button>
        </section>
        </main>

  <footer class="rodape">
        <div class="container rodape-conteudo">
            <a class="logo logo-rodape" href="../index.html">bananinha <span>WEAR</span></a>
            <p>Vista leve. Viva Banana.</p>
            <p>&copy; 2026 Bananinha Wear.</p>
        </div>
    </footer>
</body>
</html>
